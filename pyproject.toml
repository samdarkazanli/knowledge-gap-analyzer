[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-gap-analyzer"
version = "0.2.7"
description = "Discover internal concepts and generate company-specific knowledge questions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.42,<4", "pydantic>=2,<3"]

[project.scripts]
kga = "kga.cli:main"
kga-questions = "kga.question_cli:main"
kga-evaluate = "kga.evaluation_cli:main"
kga-model = "kga.model_cli:main"
kga-report = "kga.report_cli:main"
kga-consolidate = "kga.consolidation_cli:main"
kga-review-init = "kga.review_init_cli:main"
kga-review-validate = "kga.review_validate_cli:main"
kga-review-export = "kga.review_export_cli:main"
kga-tasks = "kga.tasks_cli:main"
kga-changes-init = "kga.changes_init_cli:main"
kga-changes-validate = "kga.changes_validate_cli:main"
kga-verify = "kga.verify_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
